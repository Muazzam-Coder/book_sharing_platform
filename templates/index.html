{% extends "layout.html" %}

{% block content %}
<div class="container">
    <h1>Available Books</h1>
    <div class="dashboard-grid">
        {% for book in books %}
        <div class="card">
            <h3>{{ book.title }}</h3>
            <p>Author: {{ book.author }}</p>
            <p>Type: <strong>{{ book.book_type }}</strong></p>
            
            {% if book.book_type == 'Physical' %}
                <button class="btn btn-primary" onclick="openModal('{{ book.id }}', '{{ book.title }}')">Request to Borrow</button>
            {% else %}
                <form action="/request_borrow/{{ book.id }}" method="POST">
                    <button class="btn btn-primary">Borrow & Download</button>
                </form>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</div>

<!-- Modal remains the same but inside the block -->
<div id="borrowModal" class="modal">
    <!-- ... modal code from earlier ... -->
</div>

<script>
    function openModal(bookId, bookTitle) {
        document.getElementById('borrowModal').style.display = 'block';
        document.getElementById('modalBookTitle').innerText = "Borrow: " + bookTitle;
        document.getElementById('borrowForm').action = "/request_borrow/" + bookId;
    }
    function closeModal() {
        document.getElementById('borrowModal').style.display = 'none';
    }
</script>
{% endblock %}
