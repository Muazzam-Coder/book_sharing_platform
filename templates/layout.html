<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --win-accent: #0078d4; }
        body { 
            background: url('https://i.imgur.com/3mY9I5k.jpg') center/cover no-repeat fixed;
            font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
            height: 100vh; margin: 0; display: flex; overflow: hidden;
        }
        .acrylic { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(30px) saturate(150%); border: 1px solid rgba(255,255,255,0.3); }
        .win-card { background: rgba(255,255,255,0.8); border: 1px solid white; border-radius: 16px; transition: 0.3s; display: flex; flex-direction: column; overflow: hidden; }
        .win-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .win-btn { background: var(--win-accent); color: white; border-radius: 6px; transition: 0.2s; font-weight: 600; }
        .win-btn:hover { filter: brightness(1.1); transform: scale(0.98); }
        .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; color: #444; font-weight: 500; transition: 0.2s; }
        .sidebar-link:hover { background: rgba(255,255,255,0.5); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body class="p-4 gap-4">
    <aside class="acrylic w-64 rounded-2xl p-6 flex flex-col">
        <div class="flex items-center gap-3 mb-10 px-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg shadow-lg"></div>
            <h1 class="font-bold text-xl tracking-tight">BookShare</h1>
        </div>
        <nav class="flex-1 space-y-2">
            <a href="/browse" class="sidebar-link"><i class="fa-solid fa-magnifying-glass"></i> Browse Books</a>
            <a href="/dashboard" class="sidebar-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            {% if current_user.role == 'Admin' %}
            <a href="/admin" class="sidebar-link text-red-600"><i class="fa-solid fa-shield"></i> Admin Panel</a>
            {% endif %}
        </nav>
        <div class="mt-auto pt-4 border-t border-black/5 flex items-center gap-3">
            <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center text-xs font-bold">{{ current_user.username[0]|upper }}</div>
            <div class="overflow-hidden">
                <p class="text-xs font-bold truncate">{{ current_user.username }}</p>
                <a href="/logout" class="text-[10px] text-red-500 uppercase font-black">Sign Out</a>
            </div>
        </div>
    </aside>

    <main class="flex-1 acrylic rounded-2xl p-8 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
